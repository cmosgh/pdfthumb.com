# The dashboard's nginx server, baked into the image (see Dockerfile).
# Static files only: /api never reaches nginx, because Traefik routes it to
# the backend. Listens on an unprivileged port so it runs as non-root.

# Sets $pdfthumb_theme from PDFTHUMB_THEME (nginx/theme.conf.template).
include /var/cache/nginx/theme.conf;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/dashboard;

  # Every location sets its own add_header, which stops nginx inheriting
  # server-level ones, so each repeats HSTS, nosniff and frame-ancestors.
  # HSTS is safe: the site is HTTPS-only behind Traefik's global redirect,
  # and Traefik doesn't add the header itself.

  # Vite's hashed build output: a changed file gets a new name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-ancestors 'none'";
    try_files $uri =404;
  }

  # Always revalidated, so a deploy is picked up on the next load. SSI
  # inlines the runtime theme (/theme.json below) into the page, so it
  # applies before first paint with no extra request (#138).
  location = /index.html {
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-ancestors 'none'";
  }

  # The runtime theme: a custom theme.json mounted at /etc/pdfthumb wins,
  # else the shipped theme PDFTHUMB_THEME names. Also fetchable directly.
  location = /theme.json {
    root /etc/pdfthumb;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-ancestors 'none'";
    try_files /theme.json /themes/$pdfthumb_theme.json;
  }

  # The shipped themes (public/themes). An unknown name gets the default.
  location /themes/ {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-ancestors 'none'";
    try_files $uri /themes/default.json;
  }

  # SPA fallback: client-side routes like /dashboard serve index.html,
  # through the location above.
  location / {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "frame-ancestors 'none'";
    try_files $uri /index.html;
  }
}

