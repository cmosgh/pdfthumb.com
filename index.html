<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <title>PDFThumb</title>
    <script>
      // Apply theme immediately to prevent FOUC
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          if (theme === "dark" || (!theme && prefersDark)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {
          // Ignore errors in case localStorage is not available
        }
      })();
    </script>

    <!-- The deployment's runtime theme (#138, docs/theming.md): nginx fills
         this through SSI, and the boot script below applies it before the
         body is parsed. -->
    <script type="application/json" id="pt-theme">
      <!--# include virtual="/theme.json" -->
    </script>
    <!-- pt-theme-boot -->

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-page text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
