# Replaces the image's /etc/nginx/conf.d/default.conf, whose server block
# listens on :80 and would fail to bind as non-root. Static files only: /api
# never reaches nginx, because the IngressRoute sends it to the backend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pdfthumb-dashboard.fullname" . }}-nginx
  namespace: {{ include "pdfthumb-dashboard.namespace" . }}
  labels:
    {{- include "pdfthumb-dashboard.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.containerPort }};
      server_name _;
      server_tokens off;
      root /usr/share/nginx/html;

      # Every location sets its own add_header, which stops nginx inheriting
      # server-level ones, so each repeats nosniff and frame-ancestors.

      # Vite's hashed build output: a changed file gets a new name.
      location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "frame-ancestors 'none'";
        try_files $uri =404;
      }

      # Always revalidated, so a deploy is picked up on the next load.
      location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "frame-ancestors 'none'";
      }

      # SPA fallback: client-side routes like /dashboard serve index.html,
      # through the location above.
      location / {
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "frame-ancestors 'none'";
        try_files $uri /index.html;
      }
    }
