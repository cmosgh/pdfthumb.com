apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdfthumb-dashboard.fullname" . }}
  namespace: {{ include "pdfthumb-dashboard.namespace" . }}
  labels:
    {{- include "pdfthumb-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pdfthumb-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The ConfigMap is mounted with subPath, which never updates in a
        # running pod, so a config change has to roll the pods.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pdfthumb-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The root filesystem is read-only; nginx writes its temp files under
      # /var/cache/nginx and its pid to /var/run, so those are emptyDirs.
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "pdfthumb-dashboard.fullname" . }}-nginx
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
      containers:
        - name: nginx
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "pdfthumb-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - topologyKey: {{ .topologyKey }}
          maxSkew: {{ .maxSkew }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          nodeAffinityPolicy: {{ .nodeAffinityPolicy }}
          nodeTaintsPolicy: {{ .nodeTaintsPolicy }}
          labelSelector:
            matchLabels:
              {{- include "pdfthumb-dashboard.selectorLabels" $ | nindent 14 }}
          {{- with .matchLabelKeys }}
          matchLabelKeys:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- end }}
