{{- if not (regexMatch "^[a-z0-9-]+$" (toString .Values.theme.name)) }}
{{- fail "theme.name must be lowercase letters, digits and dashes" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pdfthumb-dashboard.fullname" . }}
  namespace: {{ include "pdfthumb-dashboard.namespace" . }}
  labels:
    {{- include "pdfthumb-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pdfthumb-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # A changed custom theme rolls the pods, which read it at start.
        checksum/theme: {{ .Values.theme | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pdfthumb-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The root filesystem is read-only; nginx writes its temp files under
      # /var/cache/nginx and its pid to /var/run, so those are emptyDirs. The
      # server config is baked into the image (nginx/default.conf).
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
        {{- if .Values.theme.json }}
        - name: theme
          configMap:
            name: {{ include "pdfthumb-dashboard.fullname" . }}-theme
        {{- end }}
      containers:
        - name: nginx
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "pdfthumb-dashboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # nginx/theme.conf.template; the image falls back to "default"
            # for a name that isn't [a-z0-9-]+.
            - name: PDFTHUMB_THEME
              value: {{ .Values.theme.name | quote }}
          ports:
            - name: http
              # nginx/default.conf listens here.
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            {{- if .Values.theme.json }}
            - name: theme
              mountPath: /etc/pdfthumb
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpread }}
      {{- if .enabled }}
      topologySpreadConstraints:
        - topologyKey: {{ .topologyKey }}
          maxSkew: {{ .maxSkew }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          nodeAffinityPolicy: {{ .nodeAffinityPolicy }}
          nodeTaintsPolicy: {{ .nodeTaintsPolicy }}
          labelSelector:
            matchLabels:
              {{- include "pdfthumb-dashboard.selectorLabels" $ | nindent 14 }}
          {{- with .matchLabelKeys }}
          matchLabelKeys:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- end }}
