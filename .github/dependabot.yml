version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of the `package.json` file
    schedule:
      interval: "weekly" # Check for updates weekly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5 # Limit the number of open pull requests
    groups:
      # @tanstack/react-db and query-db-collection pin an exact @tanstack/db;
      # bumping one alone leaves two copies of db in the tree (see #86).
      tanstack-db:
        patterns:
          - "@tanstack/*db*"
  # Bumps the digest-pinned base images in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # Odd Node majors never become LTS; stay on even (LTS) lines.
      - dependency-name: "node"
        versions: ["23.x", "25.x", "27.x", "29.x", "31.x"]
