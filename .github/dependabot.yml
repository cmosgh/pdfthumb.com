version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of the `package.json` file
    schedule:
      interval: "weekly" # Check for updates weekly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5 # Limit the number of open pull requests
    groups:
      # @tanstack/react-db and query-db-collection pin an exact @tanstack/db;
      # bumping one alone leaves two copies of db in the tree (see #86).
      tanstack-db:
        patterns:
          - "@tanstack/*db*"
      # The Vite plugin pins its own tailwindcss: bumping one alone leaves
      # two copies, and the build keeps the old one (#116).
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # The CLI and its config move together (#70, #107).
      commitlint:
        patterns:
          - "@commitlint/*"
      # react and react-dom must be the same version at runtime.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  # Bumps the digest-pinned base images in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # Node majors move by ticket (e.g. #89), onto LTS lines only; patches and
      # minors still come. A "26.x" version list didn't stop 26.9.0-alpine (#110).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
