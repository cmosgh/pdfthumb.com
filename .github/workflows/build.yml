name: Build App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check Node is pinned the same everywhere
        run: scripts/check-node-pins.sh
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Check the bundle is safe to publish
        run: scripts/check-public-bundle.sh dist
